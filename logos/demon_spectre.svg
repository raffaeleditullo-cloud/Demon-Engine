<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="spectreBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <radialGradient id="sonarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0, 5)">
    <!-- Deep Radar Range Rings -->
    <circle cx="250" cy="250" r="190" fill="none" stroke="url(#spectreBlue)" stroke-width="10" stroke-dasharray="18,12" filter="url(#glow-blue)" />
    <circle cx="250" cy="250" r="190" fill="none" stroke="#cffafe" stroke-width="2.5" stroke-dasharray="18,12" />

    <circle cx="250" cy="250" r="135" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8,8" opacity="0.6" />
    <circle cx="250" cy="250" r="80" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.5" />

    <!-- 90-Degree Sonar Sweep Cone -->
    <path d="M 250 250 L 384 116 A 190 190 0 0 0 250 60 Z" fill="url(#sonarSweep)" />

    <!-- Tactical Crosshairs with Range Calibration Notches -->
    <line x1="250" y1="35" x2="250" y2="465" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8,6" opacity="0.5" />
    <line x1="35" y1="250" x2="465" y2="250" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8,6" opacity="0.5" />

    <!-- Triangulated OSINT Target Blips -->
    <circle cx="340" cy="135" r="7" fill="#06b6d4" filter="url(#glow-blue)" />
    <circle cx="340" cy="135" r="16" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="150" cy="180" r="5" fill="#3b82f6" filter="url(#glow-blue)" />
    <circle cx="330" cy="330" r="6" fill="#06b6d4" filter="url(#glow-blue)" />

    <!-- Central Recon Ocular Aperture (Spectre Eye) -->
    <circle cx="250" cy="250" r="32" fill="#020d1a" stroke="url(#spectreBlue)" stroke-width="7" filter="url(#glow-blue)" />
    <circle cx="250" cy="250" r="12" fill="#06b6d4" filter="url(#glow-blue)" />
    <circle cx="250" cy="250" r="4" fill="#ffffff" />

    <!-- Outer Corner Targeting Brackets -->
    <path d="M 90 70 L 50 70 L 50 110" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 410 70 L 450 70 L 450 110" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 90 430 L 50 430 L 50 390" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 410 430 L 450 430 L 450 390" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
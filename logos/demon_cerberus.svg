<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cerberusOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7700" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0, 5)">
    <!-- Ballistic Blast Boundary Perimeter -->
    <polygon points="250,45 425,120 425,320 250,455 75,320 75,120" 
             fill="none" stroke="url(#cerberusOrange)" stroke-width="12" stroke-linejoin="round" filter="url(#glow-orange)" />
    <polygon points="250,45 425,120 425,320 250,455 75,320 75,120" 
             fill="none" stroke="#ffedd5" stroke-width="3" stroke-linejoin="round" />

    <!-- The 3 Cerberus Vanguard Fang Blades -->
    <!-- Center Alpha Fang -->
    <path d="M 250 85 L 275 210 L 250 255 L 225 210 Z" 
          fill="none" stroke="url(#cerberusOrange)" stroke-width="8" stroke-linejoin="round" filter="url(#glow-orange)" />
    
    <!-- Left Flank Fang -->
    <path d="M 140 150 L 210 240 L 175 270 L 125 190 Z" 
          fill="none" stroke="url(#cerberusOrange)" stroke-width="7" stroke-linejoin="round" filter="url(#glow-orange)" />

    <!-- Right Flank Fang -->
    <path d="M 360 150 L 375 190 L 325 270 L 290 240 Z" 
          fill="none" stroke="url(#cerberusOrange)" stroke-width="7" stroke-linejoin="round" filter="url(#glow-orange)" />

    <!-- Sandboxed Kernel Core / Vault Gate -->
    <circle cx="250" cy="290" r="34" fill="#1f0902" stroke="url(#cerberusOrange)" stroke-width="7" filter="url(#glow-orange)" />
    <rect x="242" y="275" width="16" height="30" rx="4" fill="#ffedd5" filter="url(#glow-orange)" />
    <circle cx="250" cy="285" r="4" fill="#ff7700" />

    <!-- Hazard Chevron Notches -->
    <path d="M 215 385 L 250 415 L 285 385" fill="none" stroke="#ff7700" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-orange)" />
  </g>
</svg>
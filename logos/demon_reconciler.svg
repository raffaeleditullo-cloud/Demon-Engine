<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="reconcilerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <filter id="glow-reconciler" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Diamond Prismatic Aura (Prompt Intent vs Disk Reality Balance) -->
  <polygon points="250,35 440,250 250,465 60,250" fill="none" stroke="#d946ef" stroke-width="2" stroke-dasharray="8,6" opacity="0.45" />
  <circle cx="250" cy="250" r="190" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.5" />

  <!-- Vertical Laser Balance Axis -->
  <line x1="250" y1="20" x2="250" y2="480" stroke="#f472b6" stroke-width="2.5" stroke-dasharray="10,6" opacity="0.6" />

  <!-- Horizontal Alignment Bar -->
  <line x1="70" y1="250" x2="430" y2="250" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="10,6" opacity="0.6" />

  <!-- DEMON MASK EMBLEM - RECONCILER EDITION -->
  <g transform="translate(0, 5)">
    <!-- Back Stealth Armor Shell -->
    <polygon points="250,85 330,150 375,130 345,250 250,350 155,250 125,130 170,150" 
             fill="#0f051a" stroke="#d946ef" stroke-width="3" filter="url(#glow-reconciler)" />

    <!-- Left Horn (Prismatic Violet Laser) -->
    <path d="M 185 160 L 120 100 L 132 180 L 175 205 Z" 
          fill="#1c0a30" stroke="url(#reconcilerGlow)" stroke-width="4" filter="url(#glow-reconciler)" />
    <!-- Right Horn (Prismatic Violet Laser) -->
    <path d="M 315 160 L 380 100 L 368 180 L 325 205 Z" 
          fill="#1c0a30" stroke="url(#reconcilerGlow)" stroke-width="4" filter="url(#glow-reconciler)" />

    <!-- Forehead Diamond Third-Eye (Diff Reconciliation Lens) -->
    <polygon points="250,130 290,190 250,225 210,190" 
             fill="#240c3d" stroke="#d946ef" stroke-width="2" />
    <polygon points="250,155 262,175 250,195 238,175" fill="#f472b6" filter="url(#glow-reconciler)" />

    <!-- Left Cheek Facet -->
    <polygon points="210,190 250,225 200,285 165,235" 
             fill="#140622" stroke="#3b1760" stroke-width="1.5" />

    <!-- Right Cheek Facet -->
    <polygon points="290,190 250,225 300,285 335,235" 
             fill="#140622" stroke="#3b1760" stroke-width="1.5" />

    <!-- Cyber Slit Eyes (Prismatic Laser Violet) -->
    <polygon points="215,200 238,208 222,212" fill="#d946ef" filter="url(#glow-reconciler)" />
    <polygon points="285,200 262,208 278,212" fill="#d946ef" filter="url(#glow-reconciler)" />

    <!-- Quantum Psi (Ψ) Chin Trident (Prismatic Glow) -->
    <path d="M 226 280 L 226 304 Q 226 322, 250 322 Q 274 322, 274 304 L 274 280 M 250 268 L 250 355" 
          fill="none" stroke="url(#reconcilerGlow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-reconciler)" />
  </g>
</svg>

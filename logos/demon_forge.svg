<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="forgeEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow-emerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0, 5)">
    <!-- Molecular Accretion Ring -->
    <circle cx="250" cy="250" r="190" fill="none" stroke="#00ff88" stroke-width="2" stroke-dasharray="12,10" opacity="0.4" />

    <!-- Hexagonal Skill Crystal Monolith -->
    <polygon points="250,50 415,145 415,355 250,450 85,355 85,145" 
             fill="none" stroke="url(#forgeEmerald)" stroke-width="12" stroke-linejoin="round" filter="url(#glow-emerald)" />
    <polygon points="250,50 415,145 415,355 250,450 85,355 85,145" 
             fill="none" stroke="#d1fae5" stroke-width="3" stroke-linejoin="round" />

    <!-- Internal Isometric Facet Lines (Crystal Spires) -->
    <line x1="250" y1="50" x2="250" y2="250" stroke="url(#forgeEmerald)" stroke-width="7" filter="url(#glow-emerald)" />
    <line x1="415" y1="355" x2="250" y2="250" stroke="url(#forgeEmerald)" stroke-width="7" filter="url(#glow-emerald)" />
    <line x1="85" y1="355" x2="250" y2="250" stroke="url(#forgeEmerald)" stroke-width="7" filter="url(#glow-emerald)" />

    <!-- Permanent Skill Matrix / Infinity Symbol (Zero-Token Crystal Core) -->
    <path d="M 215 250 C 215 225, 175 225, 175 250 C 175 275, 215 275, 250 250 C 285 225, 325 225, 325 250 C 325 275, 285 275, 250 250 Z" 
          fill="none" stroke="#00ff88" stroke-width="8" stroke-linejoin="round" filter="url(#glow-emerald)" />
    <circle cx="250" cy="250" r="7" fill="#ffffff" filter="url(#glow-emerald)" />

    <!-- Hex Symmetry Nodes -->
    <circle cx="250" cy="50" r="9" fill="#00ff88" filter="url(#glow-emerald)" />
    <circle cx="415" cy="145" r="9" fill="#00ff88" filter="url(#glow-emerald)" />
    <circle cx="415" cy="355" r="9" fill="#00ff88" filter="url(#glow-emerald)" />
    <circle cx="250" cy="450" r="9" fill="#00ff88" filter="url(#glow-emerald)" />
    <circle cx="85" cy="355" r="9" fill="#00ff88" filter="url(#glow-emerald)" />
    <circle cx="85" cy="145" r="9" fill="#00ff88" filter="url(#glow-emerald)" />
  </g>
</svg>
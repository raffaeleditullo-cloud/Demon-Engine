<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="synapseCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#0044aa" />
    </linearGradient>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0, 5)">
    <!-- Neural Resonance Rings -->
    <circle cx="250" cy="250" r="185" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="10,12" opacity="0.35" />
    <circle cx="250" cy="250" r="130" fill="none" stroke="#00a8ff" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5" />

    <!-- Tri-Axon Horns & Neural Wave Channels -->
    <!-- Top North Axon -->
    <path d="M 250 170 L 250 45" stroke="url(#synapseCyan)" stroke-width="10" stroke-linecap="round" filter="url(#glow-cyan)" />
    <circle cx="250" cy="40" r="14" fill="#00f0ff" filter="url(#glow-cyan)" />
    <circle cx="250" cy="40" r="6" fill="#fff" />

    <!-- Southwest Axon Horn -->
    <path d="M 200 280 L 85 390" stroke="url(#synapseCyan)" stroke-width="10" stroke-linecap="round" filter="url(#glow-cyan)" />
    <circle cx="80" cy="395" r="14" fill="#00f0ff" filter="url(#glow-cyan)" />
    <circle cx="80" cy="395" r="6" fill="#fff" />

    <!-- Southeast Axon Horn -->
    <path d="M 300 280 L 415 390" stroke="url(#synapseCyan)" stroke-width="10" stroke-linecap="round" filter="url(#glow-cyan)" />
    <circle cx="420" cy="395" r="14" fill="#00f0ff" filter="url(#glow-cyan)" />
    <circle cx="420" cy="395" r="6" fill="#fff" />

    <!-- Central Neural Core & Synaptic Converger -->
    <polygon points="250,165 325,290 175,290" 
             fill="none" stroke="url(#synapseCyan)" stroke-width="12" stroke-linejoin="round" filter="url(#glow-cyan)" />
    <polygon points="250,165 325,290 175,290" 
             fill="none" stroke="#c0ffff" stroke-width="3" stroke-linejoin="round" />

    <!-- Inner Quantum Invariant Core -->
    <circle cx="250" cy="250" r="26" fill="#021422" stroke="url(#synapseCyan)" stroke-width="6" filter="url(#glow-cyan)" />
    <circle cx="250" cy="250" r="10" fill="#00f0ff" filter="url(#glow-cyan)" />
    <circle cx="250" cy="250" r="4" fill="#ffffff" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="synapseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#004488" />
    </linearGradient>
    <filter id="glow-synapse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Neural Halo Grid & Axon Nodes -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.4" />
  <circle cx="250" cy="250" r="145" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8,6" opacity="0.6" />

  <!-- Synaptic Radiating Connectors -->
  <line x1="120" y1="100" x2="60" y2="50" stroke="#00f0ff" stroke-width="3" stroke-dasharray="4,4" filter="url(#glow-synapse)" />
  <circle cx="55" cy="45" r="8" fill="#00f0ff" filter="url(#glow-synapse)" />

  <line x1="380" y1="100" x2="440" y2="50" stroke="#00f0ff" stroke-width="3" stroke-dasharray="4,4" filter="url(#glow-synapse)" />
  <circle cx="445" cy="45" r="8" fill="#00f0ff" filter="url(#glow-synapse)" />

  <line x1="250" y1="85" x2="250" y2="35" stroke="#00f0ff" stroke-width="4" filter="url(#glow-synapse)" />
  <circle cx="250" cy="30" r="10" fill="#00f0ff" filter="url(#glow-synapse)" />

  <!-- Lateral Axon Nodes -->
  <line x1="125" y1="130" x2="70" y2="160" stroke="#00f0ff" stroke-width="2.5" />
  <circle cx="65" cy="165" r="6" fill="#00f0ff" />
  
  <line x1="375" y1="130" x2="430" y2="160" stroke="#00f0ff" stroke-width="2.5" />
  <circle cx="435" cy="165" r="6" fill="#00f0ff" />

  <!-- DEMON MASK EMBLEM - SYNAPSE EDITION -->
  <g transform="translate(0, 5)">
    <!-- Back Stealth Armor Shell -->
    <polygon points="250,85 330,150 375,130 345,250 250,350 155,250 125,130 170,150" 
             fill="#041019" stroke="#00f0ff" stroke-width="3" filter="url(#glow-synapse)" />

    <!-- Left Horn (Synaptic Laser Array) -->
    <path d="M 185 160 L 120 100 L 132 180 L 175 205 Z" 
          fill="#0a1e2e" stroke="url(#synapseGlow)" stroke-width="4" filter="url(#glow-synapse)" />
    <!-- Right Horn (Synaptic Laser Array) -->
    <path d="M 315 160 L 380 100 L 368 180 L 325 205 Z" 
          fill="#0a1e2e" stroke="url(#synapseGlow)" stroke-width="4" filter="url(#glow-synapse)" />

    <!-- Forehead Circuit Node -->
    <polygon points="250,130 290,190 250,225 210,190" 
             fill="#0d283d" stroke="#00f0ff" stroke-width="2" />
    <circle cx="250" cy="175" r="6" fill="#00f0ff" filter="url(#glow-synapse)" />

    <!-- Left Cheek Facet -->
    <polygon points="210,190 250,225 200,285 165,235" 
             fill="#081824" stroke="#163852" stroke-width="1.5" />

    <!-- Right Cheek Facet -->
    <polygon points="290,190 250,225 300,285 335,235" 
             fill="#081824" stroke="#163852" stroke-width="1.5" />

    <!-- Cyber Slit Eyes (Electric Cyan Laser) -->
    <polygon points="215,200 238,208 222,212" fill="#00f0ff" filter="url(#glow-synapse)" />
    <polygon points="285,200 262,208 278,212" fill="#00f0ff" filter="url(#glow-synapse)" />

    <!-- Quantum Psi (Ψ) Chin Trident (Cyan Neural Pulse) -->
    <path d="M 226 280 L 226 304 Q 226 322, 250 322 Q 274 322, 274 304 L 274 280 M 250 268 L 250 355" 
          fill="none" stroke="url(#synapseGlow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-synapse)" />
  </g>
</svg>

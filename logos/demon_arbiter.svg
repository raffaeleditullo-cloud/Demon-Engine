<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="arbiterPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0, 5)">
    <!-- 3-Way Reconciliation Triad Rays -->
    <line x1="250" y1="40" x2="250" y2="460" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,8" opacity="0.4" />
    <line x1="50" y1="250" x2="450" y2="250" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,8" opacity="0.4" />

    <!-- The Diamond Judgment Rhombus (Outer Frame) -->
    <polygon points="250,55 425,250 250,445 75,250" 
             fill="none" stroke="url(#arbiterPurple)" stroke-width="12" stroke-linejoin="round" filter="url(#glow-purple)" />
    <polygon points="250,55 425,250 250,445 75,250" 
             fill="none" stroke="#f5d0fe" stroke-width="3" stroke-linejoin="round" />

    <!-- Internal Dual Parity Triangles (Prompt-to-Diff Balance) -->
    <polygon points="250,110 370,250 130,250" 
             fill="none" stroke="url(#arbiterPurple)" stroke-width="8" stroke-linejoin="round" filter="url(#glow-purple)" />
    <polygon points="250,390 370,250 130,250" 
             fill="none" stroke="url(#arbiterPurple)" stroke-width="8" stroke-linejoin="round" filter="url(#glow-purple)" />

    <!-- Central Parity Core & Precision Aperture -->
    <circle cx="250" cy="250" r="28" fill="#130826" stroke="url(#arbiterPurple)" stroke-width="6" filter="url(#glow-purple)" />
    <polygon points="250,232 268,250 250,268 232,250" fill="#f5d0fe" filter="url(#glow-purple)" />

    <!-- Flanking Equilibrium Chevrons -->
    <path d="M 120 220 L 75 250 L 120 280" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-purple)" />
    <path d="M 380 220 L 425 250 L 380 280" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-purple)" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="osintGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="neonBlurOsint" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Radar Range Rings -->
  <circle cx="250" cy="250" r="190" fill="#040c1a" stroke="url(#osintGlow)" stroke-width="5" filter="url(#neonBlurOsint)" />
  <circle cx="250" cy="250" r="135" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="14,8" />
  <circle cx="250" cy="250" r="80" fill="none" stroke="#3b82f6" stroke-width="2" />

  <!-- Crosshairs / Reticle Targeting Cross -->
  <line x1="250" y1="40" x2="250" y2="460" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8,6" />
  <line x1="40" y1="250" x2="460" y2="250" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8,6" />

  <!-- Sweeping Sonar Beam Arc (Radar Sweep Cone) -->
  <path d="M 250 250 L 385 115 A 190 190 0 0 0 250 60 Z" fill="#06b6d4" fill-opacity="0.25" />

  <!-- Deep Target Blips (Triangulated Data Nodes) -->
  <circle cx="340" cy="140" r="12" fill="#06b6d4" />
  <circle cx="340" cy="140" r="20" fill="none" stroke="#fff" stroke-width="2" />
  
  <circle cx="160" cy="190" r="8" fill="#3b82f6" />
  <circle cx="310" cy="330" r="9" fill="#06b6d4" />

  <!-- Center Eye / Pupil Sensor Aperture -->
  <circle cx="250" cy="250" r="28" fill="#020712" stroke="#06b6d4" stroke-width="5" />
  <circle cx="250" cy="250" r="12" fill="#fff" />

  <!-- Corner Tactical Bearing Notches -->
  <path d="M 120 70 L 60 70 L 60 130" fill="none" stroke="#06b6d4" stroke-width="4" />
  <path d="M 380 70 L 440 70 L 440 130" fill="none" stroke="#06b6d4" stroke-width="4" />
  <path d="M 120 430 L 60 430 L 60 370" fill="none" stroke="#06b6d4" stroke-width="4" />
  <path d="M 380 430 L 440 430 L 440 370" fill="none" stroke="#06b6d4" stroke-width="4" />
</svg>

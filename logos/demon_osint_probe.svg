<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="osintGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="glow-osint" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Recon Radar Range Rings -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="12,8" opacity="0.45" />
  <circle cx="250" cy="250" r="145" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
  <circle cx="250" cy="250" r="95" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,6" opacity="0.5" />

  <!-- Tactical Radar Sweep Cone -->
  <path d="M 250 250 L 388 112 A 195 195 0 0 0 250 55 Z" fill="url(#radarSweep)" opacity="0.6" />

  <!-- Targeting Reticle Crosshairs (Dotted Telemetry Lines) -->
  <line x1="250" y1="35" x2="250" y2="465" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  <line x1="35" y1="250" x2="465" y2="250" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Triangulated Intel Target Blips -->
  <circle cx="345" cy="125" r="5" fill="#06b6d4" filter="url(#glow-osint)" />
  <circle cx="345" cy="125" r="12" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3" />

  <circle cx="155" cy="140" r="4" fill="#3b82f6" filter="url(#glow-osint)" />
  <circle cx="360" cy="340" r="4.5" fill="#06b6d4" filter="url(#glow-osint)" />
  <circle cx="130" cy="320" r="4" fill="#3b82f6" />

  <!-- Tactical Bearing Notches -->
  <path d="M 90 60 L 50 60 L 50 100" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.7" />
  <path d="M 410 60 L 450 60 L 450 100" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.7" />
  <path d="M 90 440 L 50 440 L 50 400" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.7" />
  <path d="M 410 440 L 450 440 L 450 400" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.7" />

  <!-- DEMON MASK EMBLEM - OSINT PROBE EDITION -->
  <g transform="translate(0, 5)">
    <!-- Back Stealth Armor Shell -->
    <polygon points="250,85 330,150 375,130 345,250 250,350 155,250 125,130 170,150" 
             fill="#030b17" stroke="#06b6d4" stroke-width="3" filter="url(#glow-osint)" />

    <!-- Left Horn (Tactical Antenna Array) -->
    <path d="M 185 160 L 120 100 L 132 180 L 175 205 Z" 
          fill="#08182b" stroke="url(#osintGlow)" stroke-width="4" filter="url(#glow-osint)" />
    <!-- Right Horn (Tactical Antenna Array) -->
    <path d="M 315 160 L 380 100 L 368 180 L 325 205 Z" 
          fill="#08182b" stroke="url(#osintGlow)" stroke-width="4" filter="url(#glow-osint)" />

    <!-- Forehead Diamond Sensor Array -->
    <polygon points="250,130 290,190 250,225 210,190" 
             fill="#0b2440" stroke="#06b6d4" stroke-width="2" />
    <circle cx="250" cy="175" r="5" fill="#06b6d4" filter="url(#glow-osint)" />
    <line x1="250" y1="160" x2="250" y2="190" stroke="#3b82f6" stroke-width="1.5" />
    <line x1="235" y1="175" x2="265" y2="175" stroke="#3b82f6" stroke-width="1.5" />

    <!-- Left Cheek Facet -->
    <polygon points="210,190 250,225 200,285 165,235" 
             fill="#051424" stroke="#123254" stroke-width="1.5" />

    <!-- Right Cheek Facet -->
    <polygon points="290,190 250,225 300,285 335,235" 
             fill="#051424" stroke="#123254" stroke-width="1.5" />

    <!-- Cyber Slit Eye (Left - Standard Blue Laser) -->
    <polygon points="215,200 238,208 222,212" fill="#06b6d4" filter="url(#glow-osint)" />

    <!-- Cyber Eye (Right - Tactical Targeting Monocle Reticle) -->
    <polygon points="285,200 262,208 278,212" fill="#06b6d4" filter="url(#glow-osint)" />
    <circle cx="273" cy="207" r="14" fill="none" stroke="#06b6d4" stroke-width="2.5" filter="url(#glow-osint)" />
    <circle cx="273" cy="207" r="6" fill="#3b82f6" />
    <line x1="255" y1="207" x2="291" y2="207" stroke="#06b6d4" stroke-width="1.5" />
    <line x1="273" y1="189" x2="273" y2="225" stroke="#06b6d4" stroke-width="1.5" />

    <!-- Quantum Psi (Ψ) Chin Trident (Deep Radar Cyan Core) -->
    <path d="M 226 280 L 226 304 Q 226 322, 250 322 Q 274 322, 274 304 L 274 280 M 250 268 L 250 355" 
          fill="none" stroke="url(#osintGlow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-osint)" />
  </g>
</svg>
